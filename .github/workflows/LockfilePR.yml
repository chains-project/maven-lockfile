name: Lockfile PR
on:
  pull_request:

permissions:
  contents: read
jobs:
  check-lockfile:
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            sh.jbang.dev:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify action checksums
        uses: chains-project/maven-lockfile/.github/actions/ghasum@afe90beed184783242381d8d4ae0deb1c7cb0d47 # v5.19.1

      # A push with GITHUB_TOKEN does not start workflows, so CI would wait for approval on the regenerated
      # lockfile. Only for pull requests from this repository: forks get no secrets and only verify.
      - name: Create automation token
        id: automation-token
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          permission-contents: write # To push the regenerated lockfile

      - name: run maven-lockfile
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: chains-project/maven-lockfile@afe90beed184783242381d8d4ae0deb1c7cb0d47 # 5.19.1
        with:
          github-token: ${{ steps.automation-token.outputs.token }}
          include-maven-plugins: true
          allow-environmental-validation-failure: true
          hermetic: true

      - name: run maven-lockfile (fork/external)
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        uses: chains-project/maven-lockfile@afe90beed184783242381d8d4ae0deb1c7cb0d47 # 5.19.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          include-maven-plugins: true
          allow-environmental-validation-failure: true
          hermetic: true
          commit-lockfile: false # verify lockfile is up-to-date (not possible to update lockfile in forks)
