name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Next release version'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  build:
    name: Build and release
    # The release PR targets main, so the release has to be built from main.
    if: github.ref == 'refs/heads/main'

    permissions:
      id-token: write # For Sigstore signing (https://github.com/sigstore/sigstore-java/tree/main/sigstore-maven-plugin)
      contents: write # To push the release branch and tag, and create the GitHub release

    runs-on: ubuntu-latest

    environment: release

    outputs:
      version: ${{ steps.branch.outputs.version }}
      branch: ${{ steps.branch.outputs.branch }}
      pushed: ${{ steps.push.outputs.pushed }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # Setups the environment
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify action checksums
        uses: chains-project/maven-lockfile/.github/actions/ghasum@a52aca382ffdf77c6fc03766f097dea97067d798 # v5.18.6

      # Keep this before any step that populates ~/.m2 (setup-java cache, mvn). The action restores
      # its own Maven cache on top, and where that cache only has a plugin's POM, a JAR downloaded
      # earlier loses its _remote.repositories entry and validate records the plugin as unresolved.
      - name: run maven-lockfile (validate lockfile)
        uses: chains-project/maven-lockfile@a52aca382ffdf77c6fc03766f097dea97067d798 # 5.18.6
        with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
            include-maven-plugins: true
            allow-environmental-validation-failure: true
            commit-lockfile: false
            hermetic: true

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set git user
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "<>"

      - name: install go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0

      - name: install semversion
        run: go install github.com/ffurrer2/semver/cmd/semver@latest

      - name: Get current version from pom and remove snapshot if present.
        run: echo "CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed 's/-SNAPSHOT//')" >> $GITHUB_ENV

      - name: Get version with snapshot
        run: echo "CURRENT_VERSION_WITH_SNAPSHOT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      # Calculate next version: 
      # - if version is patch, we just increment the patch version
      # - if version is minor or major, we increment the minor or major version and set the patch version to 0
      # As we are using a snapshot version, we need to run semver next twice to get the next version for mahor and minor releases. Reason: Any X.Y.Z-SNAPSHOT version will be released as X.Y.Z if we run semver next major X.Y.Z-SNAPSHOT
      - name: Set next version
        if: ${{ github.event.inputs.version == 'patch' }}
        run: echo "NEXT_VERSION=$(semver next ${{ github.event.inputs.version }} $CURRENT_VERSION_WITH_SNAPSHOT)" >> $GITHUB_ENV

      - name: Set next version
        # semver next for a snapshot only releases the snapshot version, so we need to run it 2 times
        if: ${{ github.event.inputs.version == 'major'  || github.event.inputs.version == 'minor' }}
        run: echo "NEXT_VERSION=$(semver next ${{ github.event.inputs.version }} $CURRENT_VERSION)" >> $GITHUB_ENV

      - name: set branchname to next version
        id: branch
        run: |
          echo "BRANCH_NAME=release/$NEXT_VERSION" >> $GITHUB_ENV
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "branch=release/$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Set release version
        run: mvn --no-transfer-progress --batch-mode versions:set -DnewVersion=$NEXT_VERSION -DprocessAllModules

      # .mvn/extensions.xml and action.yml pin maven-lockfile as a core extension / plugin coordinate
      # at ${project.version}, which above is already the release version (not -SNAPSHOT) - so it
      # must keep pointing at an artifact Maven can already resolve, i.e. this deploy must run before
      # they're regenerated below.
      - name: Stage release
        run:  mvn --no-transfer-progress --batch-mode -Ppublication clean deploy -DaltDeploymentRepository=local::file:./target/staging-deploy -Dsigstore.skip=false

      - name: Generate Readme
        run : mvn generate-resources resources:copy-resources

      # Hermetic, like the action's validate: `mvn test` in a fresh copy of the tree, then generate. The
      # copy leaves out target/, which holds the staged release and the captures of the commands above.
      - name: run maven-lockfile (generate new lockfile for release version)
        run: |
          rm -rf "$RUNNER_TEMP/hermetic"
          rsync -a --exclude=/target ./ "$RUNNER_TEMP/hermetic/"
          (cd "$RUNNER_TEMP/hermetic" && mvn --batch-mode test && mvn io.github.chains-project:maven-lockfile:$NEXT_VERSION:generate -Dhermetic=true)
          cp "$RUNNER_TEMP/hermetic/lockfile.json" lockfile.json
        shell: bash

      # Not pushed until Maven Central has the artifacts (see "Push release branch and tag").
      - name: Commit and tag release
        run: |
          git checkout -b ${{ env.BRANCH_NAME }}
          git commit -am "chore: release version ${{ env.NEXT_VERSION }}"
          git tag "v${{ env.NEXT_VERSION }}"

      - name: generate buildinfo file
        run: mvn org.apache.maven.plugins:maven-artifact-plugin:3.4.1:buildinfo

      - name: Print next version
        run: mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed 's/-SNAPSHOT//'

      - name: Remove beta tags for changelog to be from previous non-beta release
        run: git tag | grep beta | xargs -n 1 git tag -d

      # The snapshot commit is prepared before the upload, so that once the release is public only
      # pushes and the GitHub release are left to fail.
      - name: Generate changelog
        uses: jreleaser/release-action@90ac653bb9c79d11179e65d81499f3f34527dcd5 # 2.5.0
        with:
          setup-java: false
          version: 1.21.0
          arguments: changelog
        env:
          JRELEASER_PROJECT_VERSION: ${{ env.NEXT_VERSION }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_MAVENCENTRAL_MAVEN_CENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_MAVEN_CENTRAL_TOKEN: ${{ secrets.JRELEASER_MAVENCENTRAL_MAVEN_CENTRAL_TOKEN }}

      - name: Append changelog from out/jreleaser/CHANGELOG.md to CHANGELOG.md with version as header
        run: |
          echo "" >> CHANGELOG.md
          echo -n "# ${{ env.NEXT_VERSION }}" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          cat out/jreleaser/release/CHANGELOG.md >> CHANGELOG.md
          echo "" >> CHANGELOG.md

      # Time to set the next version: The next version of any Release is a snapshot version of the next patch version
      - name : Set next version (patch of release version) with -SNAPSHOT suffix
        run: |
         echo "NEXT_RELEASE_VERSION=$(semver next patch $NEXT_VERSION)-SNAPSHOT" >> $GITHUB_ENV
         echo "NEXT_RELEASE_VERSION_WITHOUT_SNAPSHOT=$(semver next patch $NEXT_VERSION)" >> $GITHUB_ENV

      # action.yml/.mvn/extensions.xml are NOT regenerated here: they're templated on
      # ${project.version}, and this step bumps <version> to a -SNAPSHOT, which is never a valid,
      # resolvable coordinate for either of them to point at. They stay pinned to the release
      # version committed above until the next real release.
      - name: Set release version
        run: mvn --no-transfer-progress --batch-mode versions:set -DnewVersion=$NEXT_RELEASE_VERSION -DprocessAllModules

      # Same hermetic generation as for the release version.
      - name: run maven-lockfile (generate new lockfile for -SNAPSHOT version)
        run: |
          rm -rf "$RUNNER_TEMP/hermetic"
          rsync -a --exclude=/target ./ "$RUNNER_TEMP/hermetic/"
          (cd "$RUNNER_TEMP/hermetic" && mvn --batch-mode test && mvn io.github.chains-project:maven-lockfile:$NEXT_VERSION:generate -Dhermetic=true)
          cp "$RUNNER_TEMP/hermetic/lockfile.json" lockfile.json
        shell: bash

      # Until they're pushed these commits only exist here: the bundle (uploaded below) keeps them in
      # case the job dies after Maven Central has published the release.
      - name: Commit snapshot version
        run: |
          git commit -am "chore: set snapshot version ${{ env.NEXT_RELEASE_VERSION }}"
          git bundle create target/release.bundle ${{ env.BRANCH_NAME }} "v${{ env.NEXT_VERSION }}" "^${{ github.sha }}"

      - name: Deploy to Maven Central
        uses: jreleaser/release-action@90ac653bb9c79d11179e65d81499f3f34527dcd5 # 2.5.0
        with:
          setup-java: false
          version: 1.21.0
          arguments: deploy
        env:
          JRELEASER_PROJECT_VERSION: ${{ env.NEXT_VERSION }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_MAVENCENTRAL_MAVEN_CENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_MAVEN_CENTRAL_TOKEN: ${{ secrets.JRELEASER_MAVENCENTRAL_MAVEN_CENTRAL_TOKEN }}

      # The release is public from here on: don't re-run this job, Maven Central rejects the second
      # upload. bump-action-pins still runs if a later step of this job fails.
      - name: Push release branch and tag
        id: push
        run: |
          git push --atomic --set-upstream origin ${{ env.BRANCH_NAME }} "refs/tags/v${{ env.NEXT_VERSION }}"
          echo "pushed=true" >> $GITHUB_OUTPUT

      # Creates the immutable GitHub release on the tag pushed above. The changelog covers the previous
      # tag up to this tag, so the snapshot commit on top isn't in it. release.github.skipTag in
      # jreleaser.yml keeps JReleaser from tagging again, and the excluded deployer already ran.
      - name: Create GitHub release
        uses: jreleaser/release-action@90ac653bb9c79d11179e65d81499f3f34527dcd5 # 2.5.0
        with:
          setup-java: false
          version: 1.21.0
          arguments: release --exclude-deployer-name=maven-central
        env:
          JRELEASER_PROJECT_VERSION: ${{ env.NEXT_VERSION }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_MAVENCENTRAL_MAVEN_CENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_MAVEN_CENTRAL_TOKEN: ${{ secrets.JRELEASER_MAVENCENTRAL_MAVEN_CENTRAL_TOKEN }}

      # Log failure:
      - name: JReleaser release output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jreleaser-release
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
            target/release.bundle

  bump-action-pins:
    name: Bump maven-lockfile action pins
    needs: build
    # Also after a failure in build once the branch is up (e.g. creating the GitHub release), so the
    # release PR still gets opened.
    if: ${{ !cancelled() && needs.build.outputs.pushed == 'true' }}

    permissions:
      contents: read

    runs-on: ubuntu-latest

    environment: release

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.branch }}
          persist-credentials: false

      - name: Verify action checksums
        uses: chains-project/maven-lockfile/.github/actions/ghasum@a52aca382ffdf77c6fc03766f097dea97067d798 # v5.18.6

      - name: Point maven-lockfile pins at the release tag
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          TAG_SHA=$(git rev-parse "v$VERSION^{commit}")
          sed -i -E "s|(chains-project/maven-lockfile(/\.github/actions/ghasum)?@)[0-9a-f]{40} # (v?)[^[:space:]]+|\1$TAG_SHA # \3$VERSION|" .github/workflows/*.yml
          if grep -hoE 'chains-project/maven-lockfile[^@[:space:]]*@[0-9a-f]{40}' .github/workflows/*.yml | grep -v "@$TAG_SHA$"; then
            echo "::error::Above maven-lockfile pins were not bumped to $TAG_SHA"
            exit 1
          fi

      - name: Update gha.sum
        uses: chains-project/maven-lockfile/.github/actions/ghasum@a52aca382ffdf77c6fc03766f097dea97067d798 # v5.18.6
        with:
          mode: update

      - name: Create automation token
        id: automation-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          permission-contents: write # To push a commit
          permission-workflows: write # To push changes under .github/workflows/
          permission-pull-requests: write # To open the release PR and enable auto-merge

      - name: Commit & Push pin bump
        env:
          BRANCH: ${{ needs.build.outputs.branch }}
          GH_TOKEN: ${{ steps.automation-token.outputs.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
          git commit -am "chore: bump lockfile actions version to \`$VERSION\`"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" "HEAD:$BRANCH"

      # Opened with the app token so the PR's checks run. Auto-merge uses a merge commit, which keeps
      # the tagged release commit's SHA on main; rebase or squash would rewrite it.
      - name: Open release PR with auto-merge
        env:
          BRANCH: ${{ needs.build.outputs.branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.automation-token.outputs.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh pr create \
            --title "Release version $VERSION" \
            --body "Version $VERSION is already on Maven Central, tagged \`v$VERSION\`. Auto-merge is on with a merge commit, which keeps the tagged commit's SHA on main: don't rebase or squash this PR. If main has moved, use \"Update branch\" -> \"Update with merge commit\", not rebase." \
            --base main \
            --head "$BRANCH"
          gh pr merge "$BRANCH" --auto --merge
